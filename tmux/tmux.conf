# ============================================================
#  tmux.conf — Ghostty + Catppuccin Macchiato + Vim keybinds
#  macOS / Neovim-friendly
# ============================================================

# ── Prefix ──────────────────────────────────────────────────
# Use Ctrl-a (screen-style) — easier to reach than Ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ─────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # true-colour for Ghostty
set -g mouse on
set -g history-limit 50000
set -g base-index 1          # windows start at 1
set -g pane-base-index 1     # panes start at 1
set -g renumber-windows on   # fill gaps when a window is closed
set -sg escape-time 0        # instant Esc in Neovim (critical!)
set -g focus-events on       # pass focus events to Neovim
set -g set-clipboard on

# ── Reload config ───────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "  Config reloaded"

# ── Vim-style pane navigation ───────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Vim-style keys (repeatable)
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# ── Splits (stay in current directory) ──────────────────────
bind | split-window -h -c "#{pane_current_path}"   # vertical split
bind - split-window -v -c "#{pane_current_path}"   # horizontal split
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Window navigation ────────────────────────────────────────
bind -r n next-window
bind -r p previous-window
bind Tab last-window          # toggle last window

# ── Copy mode — Vim keybinds ─────────────────────────────────
setw -g mode-keys vi

bind Enter copy-mode          # enter copy mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi V   send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel "pbcopy"  # macOS clipboard
bind -T copy-mode-vi H   send -X start-of-line
bind -T copy-mode-vi L   send -X end-of-line
bind -T copy-mode-vi Escape send -X cancel

# ── Smart pane switching (works with vim-tmux-navigator) ─────
# Uncomment if you use christoomey/vim-tmux-navigator in Neovim
# is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
# bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
# bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
# bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
# bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# ── Status bar position ──────────────────────────────────────
set -g status-position bottom
set -g status-interval 5

# ── Catppuccin Macchiato palette ────────────────────────────
thm_bg="#24273a"
thm_fg="#cad3f5"
thm_cyan="#91d7e3"
thm_black="#1e2030"
thm_gray="#363a4f"
thm_magenta="#c6a0f6"
thm_pink="#f5bde6"
thm_red="#ed8796"
thm_green="#a6da95"
thm_yellow="#eed49f"
thm_blue="#8aadf4"
thm_orange="#f5a97f"
thm_lavender="#b7bdf8"
thm_surface0="#363a4f"
thm_surface1="#494d64"
thm_surface2="#5b6078"

# ── Pane borders ─────────────────────────────────────────────
set -g pane-border-style "fg=${thm_surface1}"
set -g pane-active-border-style "fg=${thm_blue}"

# ── Status bar ───────────────────────────────────────────────
set -g status-style "bg=${thm_black},fg=${thm_fg}"
set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#[bg=${thm_blue},fg=${thm_black},bold] 󰁕 #S #[bg=${thm_black},fg=${thm_blue}]"
set -g status-right "#[fg=${thm_surface2}]#[bg=${thm_surface2},fg=${thm_fg}]  %d %b #[bg=${thm_surface2},fg=${thm_magenta}]#[bg=${thm_magenta},fg=${thm_black},bold]  %H:%M #[bg=${thm_black},fg=${thm_magenta}]"

setw -g window-status-style "bg=${thm_black},fg=${thm_surface2}"
setw -g window-status-format " #[fg=${thm_surface2}]#I #W "
setw -g window-status-current-style "bg=${thm_black},fg=${thm_blue},bold"
setw -g window-status-current-format "#[fg=${thm_blue}]#[bg=${thm_surface0},fg=${thm_blue},bold] #I  #W #[bg=${thm_black},fg=${thm_surface0}]"
setw -g window-status-separator ""

# ── Message / command line ───────────────────────────────────
set -g message-style "bg=${thm_surface0},fg=${thm_yellow},bold"
set -g message-command-style "bg=${thm_surface0},fg=${thm_cyan}"

# ── Mode (copy mode) highlight ───────────────────────────────
setw -g mode-style "bg=${thm_magenta},fg=${thm_black},bold"

# ── Clock mode ───────────────────────────────────────────────
setw -g clock-mode-colour "${thm_blue}"

# ============================================================
#  Plugin manager (TPM) — optional but recommended
#  Install: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#  Then press: prefix + I  to install plugins
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # persist sessions across restarts
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save every 15 min
set -g @plugin 'tmux-plugins/tmux-yank'        # improved yank (syncs pbcopy)

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'      # restore Neovim sessions too

# Initialize TPM (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'
